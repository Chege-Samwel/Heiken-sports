name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Android 6.0+ / Android TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (signed, installable on any device)
        run: gradle -p android --no-daemon assembleDebug

      - name: Build release APK (unsigned unless secrets configured)
        run: gradle -p android --no-daemon assembleRelease

      # Optional: sign the release APK automatically.
      # Create these repository secrets: ANDROID_KEYSTORE_BASE64 (base64 of your .keystore),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
      - name: Sign release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          gradle -p android --no-daemon assembleRelease \
            -PksFile=release.keystore \
            -PksPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PksAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          rm -f android/release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamsports99-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: streamsports99-release-apk
          path: android/app/build/outputs/apk/release/*.apk
